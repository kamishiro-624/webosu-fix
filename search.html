<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GZ2M72GJ5S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-GZ2M72GJ5S');
  </script>

  <meta charset="utf-8" />
  <title>Search</title>
  <link rel="stylesheet" href="style/picnic.min.css" />
  <link rel="stylesheet" type="text/css" href="style/main.css" />
  <link rel="stylesheet" type="text/css" href="style/font.css" />
  <link rel="icon" href="favicon.png" />

  <meta name="viewport" content="width=device-width">
  <meta name="description"
    content="Play WebOsu – A browser-based rhythm game inspired by osu!std. Experience fast-paced gameplay with an extensive beatmap library. No downloads, play free online now!">
<script src="scripts/config.js"></script>
  <script src="scripts/launchgame.js"></script>
  <script src="scripts/downloader.js"></script>
  <script src="scripts/addbeatmaplist.js"></script>
  <script src="scripts/settings.js"></script>
  <script src="scripts/jsloader.js"></script>
</head>

<body>
  <div class="game-area" id="game-area" hidden></div>

  <div class="pause-menu" id="pause-menu" hidden>
    <div class="paused-title">paused</div>
    <div class="button-list">
      <div class="pausebutton continue" id="pausebtn-continue">
        <div class="inner">Continue</div>
      </div>
      <div class="pausebutton retry" id="pausebtn-retry">
        <div class="inner">Retry</div>
      </div>
      <div class="pausebutton quit" id="pausebtn-quit">
        <div class="inner">Quit</div>
      </div>
    </div>
  </div>

  <nav id="main-nav"></nav>

  <script>
    fetch("navbar.html")
      .then((response) => response.text())
      .then((content) => {
        document.getElementById("main-nav").innerHTML = content;
      });
  </script>

  <div class="main-page" id="main-page">
    <div class="main-content">
      <form class="difficulty-filter" id="difficulty-filter">
        <label for="min-stars">Difficulty</label>
        <input id="min-stars" type="range" min="0" max="10" step="0.1" value="0">
        <output id="min-stars-value" for="min-stars">0.0</output>
        <span>-</span>
        <input id="max-stars" type="range" min="0" max="10" step="0.1" value="10">
        <output id="max-stars-value" for="max-stars">10.0</output>
        <span>stars</span>
        <button type="submit">Apply</button>
      </form>
      <div class="beatmap-list" id="beatmap-list">
        <!-- to be filled in script -->
      </div>
      <div class="button" style="width: 100%; margin-bottom: 10px" id="btnmore">
        Load more
      </div>
      <div id="footer"></div>
      <script>
        fetch("footer.html")
          .then((response) => response.text())
          .then((content) => {
            document.getElementById("footer").innerHTML = content;
          });
      </script>
    </div>
    <!-- <div class="side-panel">
                to be activated in script
            </div> -->
    <div class="statuslines" id="statuslines">
      <div class="progress" id="script-progress">
        Scripts
        <div class="lds-dual-ring"></div>
      </div>
      <div class="progress" id="skin-progress">
        Skin
        <div class="lds-dual-ring"></div>
      </div>
      <div class="progress" id="sound-progress">
        Hitsounds
        <div class="lds-dual-ring"></div>
      </div>
    </div>
  </div>
  <script>
    let url = new URL(window.location.href);
    let keyword = url.searchParams.get("q");
    let minStars = Number(url.searchParams.get("minStars")) || 0;
    let maxStars = Number(url.searchParams.get("maxStars")) || 10;
    let difficultyFilter = getDifficultyFilter(minStars, maxStars);
    document.getElementById("min-stars").value = minStars;
    document.getElementById("max-stars").value = maxStars;
    document.getElementById("min-stars-value").value = minStars.toFixed(1);
    document.getElementById("max-stars-value").value = maxStars.toFixed(1);
    function updateDifficultyValues() {
      let minSlider = document.getElementById("min-stars");
      let maxSlider = document.getElementById("max-stars");
      if (Number(minSlider.value) > Number(maxSlider.value)) maxSlider.value = minSlider.value;
      document.getElementById("min-stars-value").value = Number(minSlider.value).toFixed(1);
      document.getElementById("max-stars-value").value = Number(maxSlider.value).toFixed(1);
    }
    document.getElementById("min-stars").oninput = updateDifficultyValues;
    document.getElementById("max-stars").oninput = updateDifficultyValues;
    document.getElementById("difficulty-filter").onsubmit = function (event) {
      event.preventDefault();
      let params = new URLSearchParams(window.location.search);
      let selectedMin = document.getElementById("min-stars").value;
      let selectedMax = document.getElementById("max-stars").value;
      if (selectedMin === "0") params.delete("minStars");
      else params.set("minStars", selectedMin);
      if (selectedMax === "10") params.delete("maxStars");
      else params.set("maxStars", selectedMax);
      window.location.href = "search.html?" + params.toString();
    };
    //document.getElementById("inputtext").value = keyword;
    var cur = 0;
    if (keyword == parseInt(keyword, 10)) {
      // is sid
      addBeatmapSid(keyword);
    } else {
      // search keyword
      addBeatmapList(
        getListUrl({ offset: 0, query: keyword }),
        document.getElementById("beatmap-list"),
        undefined,
        undefined,
        difficultyFilter
      );
      cur = 20;
    }
    document.getElementById("btnmore").onclick = function () {
      addBeatmapList(
        getListUrl({ offset: cur, query: keyword }),
        document.getElementById("beatmap-list"),
        undefined,
        undefined,
        difficultyFilter
      );
      cur += 20;
    };
  </script>
</body>

</html>
